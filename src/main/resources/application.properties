# ===============================
# Application
# ===============================
spring.application.name=${DB_NAME}
server.port=8080

# ===============================
# Datasource / PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL}        # create-drop, update, validate, none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Jasypt (for encrypted properties)
# ===============================
jasypt.encryptor.password=${JASYPT_ENCRYPTED_PASSWORD}
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.pool-size=1
jasypt.encryptor.provider-class=org.bouncycastle.jce.provider.BouncyCastleProvider
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.RandomIvGenerator

# ===============================
# JWT / Security
# ===============================
security.jwt.secret=${SECRET}
security.jwt.expiration-ms=${EXPIRATION_MS}
security.jwt.refresh-expiration-ms=${REFRESH_EXPIRATION_MS}

# ===============================
# Mail
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.check4tech=DEBUG
logging.file.name=logs/${spring.application.name}.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ===============================
# Scheduling (for license alert tasks)
# ===============================
spring.task.scheduling.pool.size=5

# ===============================
# Other application properties
# ===============================
init.mode=${INIT_MODE}  # ALWAYS, NEVER
